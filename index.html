<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Audio Player - Mark OC Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        @keyframes neonRainbow {
            0% { --neon-color: #ff0055; --neon-sec: #00ffff; }
            33% { --neon-color: #00ff66; --neon-sec: #ff00ff; }
            66% { --neon-color: #00f3ff; --neon-sec: #ffff00; }
            100% { --neon-color: #ff0055; --neon-sec: #00ffff; }
        }

        :root {
            --neon-color: #ff0055;
            --neon-sec: #00ffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030308;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.04) 1px, transparent 1px);
            background-size: 35px 35px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            animation: neonRainbow 12s infinite linear;
        }

        .player-card {
            background: rgba(10, 10, 22, 0.95);
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            border: 3px solid var(--neon-color);
            box-shadow: 0 0 30px var(--neon-color), 
                        inset 0 0 20px var(--neon-sec);
            text-align: center;
            z-index: 999;
            position: relative;
        }

        .player-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-color);
            letter-spacing: 4px;
            margin-bottom: 24px;
            text-shadow: 0 0 10px var(--neon-color);
            text-transform: uppercase;
        }

        .screen {
            background: #010104;
            border: 2px solid var(--neon-sec);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px var(--neon-sec), 
                        0 0 10px var(--neon-sec);
        }

        .track-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .artist-name {
            font-size: 1.3rem;
            color: var(--neon-sec);
            text-shadow: 0 0 8px var(--neon-sec);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-container {
            width: 100%;
            background: #0d0d1a;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--neon-sec);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-sec), var(--neon-color));
            width: 0%;
            box-shadow: 0 0 12px var(--neon-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-color);
            color: var(--neon-color);
            padding: 12px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 10px var(--neon-color);
            transition: all 0.2s ease-in-out;
            flex: 1;
            text-shadow: 0 0 5px var(--neon-color);
        }

        .btn:hover {
            background: var(--neon-color);
            color: #030308;
            box-shadow: 0 0 25px var(--neon-color);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playlist-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #a0a0c0;
            padding: 10px 14px;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.3rem;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .playlist-btn:hover {
            border-color: var(--neon-color);
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .playlist-btn.active {
            background: linear-gradient(90deg, var(--neon-color), var(--neon-sec));
            color: #030308;
            font-weight: bold;
            border-color: #fff;
            box-shadow: 0 0 15px var(--neon-color);
        }
    </style>
</head>
<body>

    <audio id="audioPlayer"></audio>

    <div class="player-card">
        <div class="player-header">// NEON AUDIO SYSTEM //</div>

        <div class="screen">
            <div class="track-title" id="trackTitle">MÚSICA 1</div>
            <div class="artist-name">MARK OC MUSIC</div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls">
            <button class="btn" id="prevBtn">&lt;&lt; ANT</button>
            <button class="btn" id="playPauseBtn">PLAY</button>
            <button class="btn" id="nextBtn">SIG &gt;&gt;</button>
        </div>

        <div class="playlist">
            <button class="playlist-btn active" data-index="0">01. MÚSICA 1</button>
            <button class="playlist-btn" data-index="1">02. MÚSICA 2</button>
            <button class="playlist-btn" data-index="2">03. MÚSICA 3</button>
            <button class="playlist-btn" data-index="3">04. MÚSICA 4</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const trackTitle = document.getElementById('trackTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const playlistBtns = document.querySelectorAll('.playlist-btn');

     // Ejemplo de lo que sueles buscar en el código
const playlist = [
  { title: "Bailaré 1", src: "Bailaré.mp3" },
  { title: "Bajo la lluvia 2", src: "Bajo la lluvia.mp3" },
  { title: "Castigador 3", src: "Castigador.mp3" },
  { title: "Movindote 4", src: "Movindote.mp3" }
];

        let currentIndex = 0;

        function cargarYReproducir(index) {
            currentIndex = index;
            audio.src = playlist[currentIndex].src;
            trackTitle.innerText = playlist[currentIndex].name;

            playlistBtns.forEach((btn, idx) => {
                if (idx === currentIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            audio.play().then(() => {
                playPauseBtn.innerText = "PAUSA";
            }).catch(err => {
                console.log("Autoplay retenido por el navegador. Pulsa PLAY.", err);
                playPauseBtn.innerText = "PLAY";
            });
        }

        // Lanzar reproducción automática al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            cargarYReproducir(0);
        });

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playPauseBtn.innerText = "PAUSA";
                }).catch(err => console.log(err));
            } else {
                audio.pause();
                playPauseBtn.innerText = "PLAY";
            }
        });

        nextBtn.addEventListener('click', () => {
            let next = currentIndex + 1;
            if (next >= playlist.length) next = 0; // Vuelve a la primera al llegar al final
            cargarYReproducir(next);
        });

        prevBtn.addEventListener('click', () => {
            let prev = currentIndex - 1;
            if (prev < 0) prev = playlist.length - 1;
            cargarYReproducir(prev);
        });

        playlistBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                let idx = parseInt(btn.getAttribute('data-index'));
                cargarYReproducir(idx);
            });
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                let percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        });

        progressContainer.addEventListener('click', (e) => {
            let width = progressContainer.clientWidth;
            let clickX = e.offsetX;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        });

        // Al terminar una canción, pasa automáticamente a la siguiente en bucle infinito
        audio.addEventListener('ended', () => {
            let next = currentIndex + 1;
            if (next >= playlist.length) {
                next = 0; // Bucle continuo: vuelve a la pista 1
            }
            cargarYReproducir(next);
        });
    </script>
</body>
</html>
