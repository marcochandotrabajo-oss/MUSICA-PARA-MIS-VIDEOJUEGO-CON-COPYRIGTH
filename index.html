<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Videojuegos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #ffc0cb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .player-card { background-color: #121212; width: 420px; padding: 24px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); color: #ffffff; }
        .top-section { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .album-art { width: 90px; height: 90px; background-color: #ff1e56; border-radius: 16px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(255, 30, 86, 0.4); flex-shrink: 0; }
        .album-art svg { width: 48px; height: 48px; fill: #ffffff; }
        .track-info { flex-grow: 1; }
        .artist-name { font-size: 0.9rem; color: #a0a0a0; margin-bottom: 4px; }
        .song-title { font-size: 1.4rem; font-weight: 700; color: #ffffff; }
        .progress-container { margin-bottom: 16px; }
        .progress-bar { appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #333333; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff1e56; cursor: pointer; }
        .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #a0a0a0; margin-top: 6px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 24px 0; }
        .ctrl-btn { background: none; border: none; cursor: pointer; fill: #ffffff; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn svg { width: 32px; height: 32px; }
        .volume-section { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        .volume-section svg { width: 20px; height: 20px; fill: #a0a0a0; }
        .volume-bar { appearance: none; width: 100%; height: 5px; border-radius: 3px; background: #333333; outline: none; cursor: pointer; }
        .volume-bar::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff1e56; cursor: pointer; }
    </style>
</head>
<body>

    <div class="player-card">
        <audio id="audioElement" src="./musica1.mp3"></audio>

        <div class="top-section">
            <div class="album-art">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <div class="track-info">
                <div class="artist-name">Mark OC Music</div>
                <div class="song-title">Música 1</div>
            </div>
        </div>

        <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" step="0.1">
            <div class="time-info">
                <span id="currentTime">00:00</span>
                <span id="durationTime">00:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="playPauseBtn" title="Reproducir / Pausar">
                <svg id="playIcon" viewBox="0 0 24 24" style="display: block;"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <div class="volume-section">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" id="volumeBar" class="volume-bar" min="0" max="1" step="0.05" value="1">
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const volumeBar = document.getElementById('volumeBar');

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes < 10 ? '0' : ''}${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audio.duration);
        });

        progressBar.addEventListener('input', () => {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        volumeBar.addEventListener('input', () => {
            audio.volume = volumeBar.value;
        });
    </script>
</body>
</html>
