<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor MP3 - Mark OC Music</title>
    <style>
        :root {
            --ipod-color: #f7a828;
            --text-color: #555;
            --bg-color: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .ipod-container {
            background-color: var(--ipod-color);
            width: 300px;
            height: 350px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 -5px 10px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .ipod-top {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: var(--text-color);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .jack-port {
            width: 35px;
            height: 35px;
            background-color: #d18b1f;
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }
        .jack-port::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            background-color: #333;
            border-radius: 50%;
        }

        .shuffle-switch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .shuffle-switch {
            width: 40px;
            height: 12px;
            background-color: #d18b1f;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
        }
        .shuffle-knob {
            width: 20px;
            height: 10px;
            background-color: #b0741a;
            border-radius: 5px;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: left 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .shuffle-switch.active .shuffle-knob {
            left: 19px;
        }

        .controls-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px auto;
            position: relative;
        }

        .outer-circle {
            width: 100%;
            height: 100%;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            color: var(--text-color);
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inner-circle {
            width: 90px;
            height: 90px;
            background-color: #ededed;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .inner-circle:active {
            background-color: #d0d0d0;
        }

        .play-pause-icon {
            width: 24px;
            height: 30px;
            display: flex;
            justify-content: space-between;
        }
        .play-pause-icon::before, .play-pause-icon::after {
            content: '';
            width: 10px;
            height: 100%;
            background-color: var(--text-color);
        }
        .ipod-container.playing .play-pause-icon {
            width: 0; height: 0;
            border-left: 20px solid var(--text-color);
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            background: none;
        }
        .ipod-container.playing .play-pause-icon::before,
        .ipod-container.playing .play-pause-icon::after {
            display: none;
        }

        .btn {
            position: absolute;
            cursor: pointer;
            user-select: none;
            padding: 15px;
        }
        .btn:active {
            color: #000;
        }
        .btn-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .btn-next { right: 20px; top: 50%; transform: translateY(-50%); }
        .btn-up { top: 20px; left: 50%; transform: translateX(-50%); }
        .btn-down { bottom: 20px; left: 50%; transform: translateX(-50%); }

        .lcd-screen {
            background-color: #111;
            color: #0ff;
            font-family: 'VT323', monospace;
            width: 100%;
            height: 60px;
            padding: 8px 20px;
            box-sizing: border-box;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-top: 1px solid rgba(0,0,0,0.2);
        }
        .track-title {
            font-size: 1.3rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .artist-name {
            color: #0cc;
            font-size: 0.9rem;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ipod-container" id="ipodDevice">

        <div class="ipod-top">
            <span>SHUFFLE</span>
            <div class="jack-port"></div>
            <div class="shuffle-switch-container">
                <div class="shuffle-switch" id="shuffleBtn" onclick="toggleShuffle()">
                    <div class="shuffle-knob"></div>
                </div>
                <span style="font-size: 0.6rem;">ALEATORIO</span>
            </div>
        </div>

        <audio id="audioPlayer"></audio>

        <div class="controls-wrapper">
            <div class="outer-circle">
                <div class="btn btn-up" onclick="ajustarVolumen(0.1)">+</div>
                <div class="btn btn-down" onclick="ajustarVolumen(-0.1)">-</div>
                <div class="btn btn-prev" onclick="cambiarPista(-1)">|&lt;&lt;</div>
                <div class="btn btn-next" onclick="cambiarPista(1)">&gt;&gt;|</div>

                <div class="inner-circle" onclick="playPause()">
                    <div class="play-pause-icon" id="playPauseIcon"></div>
                </div>
            </div>
        </div>

        <div class="lcd-screen">
            <div class="track-title" id="trackTitle">Cargando música...</div>
            <div class="artist-name">Mark OC Music</div>
        </div>

    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const ipodDevice = document.getElementById('ipodDevice');
        const trackTitleDisplay = document.getElementById('trackTitle');
        const shuffleBtn = document.getElementById('shuffleBtn');
        let isPlaying = false;
        let isShuffleOn = false;

        const playlist = [
            { title: "Música 1", src: "./musica1.mp3" },
            { title: "Música 2", src: "./musica2.mp3" },
            { title: "Música 3", src: "./musica3.mp3" },
            { title: "Música 4", src: "./musica4.mp3" }
        ];

        let currentTrackIndex = 0;

        function cargarPista(index) {
            if (index < 0 || index >= playlist.length) return;

            currentTrackIndex = index;
            audio.src = playlist[index].src;
            trackTitleDisplay.innerText = playlist[index].title;

            audio.load();
            audio.play().then(() => {
                isPlaying = true;
                ipodDevice.classList.add('playing');
            }).catch(error => {
                console.log("El navegador bloqueó la reproducción automática. Haz clic para reproducir.");
                isPlaying = false;
                ipodDevice.classList.remove('playing');
            });
        }

        function playPause() {
            if (playlist.length === 0) return;

            if (!isPlaying) {
                if (audio.src === "" || audio.paused) {
                    if (isShuffleOn) {
                        currentTrackIndex = Math.floor(Math.random() * playlist.length);
                    }
                    cargarPista(currentTrackIndex);
                } else {
                     audio.play();
                     isPlaying = true;
                     ipodDevice.classList.add('playing');
                }
            } else {
                audio.pause();
                isPlaying = false;
                ipodDevice.classList.remove('playing');
            }
        }

        function cambiarPista(direccion) {
            let nextIndex;

            if (isShuffleOn && direccion === 1) {
                do {
                   nextIndex = Math.floor(Math.random() * playlist.length);
                } while (nextIndex === currentTrackIndex);
            } else {
                nextIndex = currentTrackIndex + direccion;
            }

            if (nextIndex < 0) nextIndex = playlist.length - 1;
            if (nextIndex >= playlist.length) nextIndex = 0;

            cargarPista(nextIndex);
        }

        function toggleShuffle() {
            isShuffleOn = !isShuffleOn;
            if (isShuffleOn) {
                shuffleBtn.classList.add('active');
                let tempTitle = trackTitleDisplay.innerText;
                trackTitleDisplay.innerText = "Modo: Aleatorio";
                setTimeout(() => trackTitleDisplay.innerText = tempTitle, 1500);
            } else {
                shuffleBtn.classList.remove('active');
                let tempTitle = trackTitleDisplay.innerText;
                trackTitleDisplay.innerText = "Modo: Normal";
                setTimeout(() => trackTitleDisplay.innerText = tempTitle, 1500);
            }
        }

        function ajustarVolumen(cantidad) {
            let nuevoVolumen = audio.volume + cantidad;
            audio.volume = Math.max(0, Math.min(1, nuevoVolumen));
        }

        audio.addEventListener('ended', () => {
            cambiarPista(1);
        });

        // Intentar reproducir automáticamente nada más cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            // Carga la primera canción (Música 1) y lanza el autoplay
            cargarPista(0);
        });
    </script>
</body>
</html>
