<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Musical</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffc0cb; /* Fondo rosado similar a la referencia */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-card {
            background-color: #121212;
            width: 420px;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }

        .top-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            position: relative;
        }

        .album-art {
            width: 90px;
            height: 90px;
            background-color: #ff1e56;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(255, 30, 86, 0.4);
            flex-shrink: 0;
        }

        .album-art svg {
            width: 48px;
            height: 48px;
            fill: #ffffff;
        }

        .track-info {
            flex-grow: 1;
        }

        .artist-name {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .song-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .airplay-icon {
            position: absolute;
            top: 0;
            right: 0;
            fill: #a0a0a0;
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        /* Barra de Progreso */
        .progress-container {
            margin-bottom: 16px;
        }

        .progress-bar {
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333333;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff1e56;
            cursor: pointer;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a0a0a0;
            margin-top: 6px;
        }

        /* Controles Principales */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 10px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            fill: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
        }

        .ctrl-btn svg {
            width: 24px;
            height: 24px;
        }

        .play-pause-btn svg {
            width: 32px;
            height: 32px;
        }

        /* Control de Volumen */
        .volume-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .volume-section svg {
            width: 20px;
            height: 20px;
            fill: #a0a0a0;
        }

        .volume-bar {
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: #333333;
            outline: none;
            cursor: pointer;
        }

        .volume-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff1e56;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Elemento de audio oculto o manejado por JS -->
        <audio id="audioElement" src="./musica1.mp3"></audio>

        <div class="top-section">
            <div class="album-art">
                <!-- Icono de nota musical vectorial -->
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <div class="track-info">
                <div class="artist-name" id="artistName">Mark OC Music</div>
                <div class="song-title" id="songTitle">Música 1</div>
            </div>
            <!-- Icono superior derecho -->
            <svg class="airplay-icon" viewBox="0 0 24 24"><path d="M6 22h12a2 2 0 0 0 2-2V8l-6-6H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2zm7-17.5L18.5 10H13V4.5zM6 20V4h6v7h7v9H6z"/></svg>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" step="0.1">
            <div class="time-info">
                <span id="currentTime">00:00</span>
                <span id="durationTime">04:32</span>
            </div>
        </div>

        <!-- Botones de control central -->
        <div class="controls">
            <!-- Botón repetir / anterior -->
            <button class="ctrl-btn" id="prevBtn" title="Anterior">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>

            <!-- Play / Pause -->
            <button class="ctrl-btn play-pause-btn" id="playPauseBtn" title="Reproducir / Pausar">
                <svg id="playIcon" viewBox="0 0 24 24" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <!-- Botón siguiente / repetir bucle -->
            <button class="ctrl-btn" id="nextBtn" title="Siguiente">
                <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
            </button>
        </div>

        <!-- Control de volumen -->
        <div class="volume-section">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" id="volumeBar" class="volume-bar" min="0" max="1" step="0.05" value="1">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const volumeBar = document.getElementById('volumeBar');

        // Formatear segundos a MM:SS
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes < 10 ? '0' : ''}${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Play / Pause interactivo
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        // Actualizar barra de progreso y tiempos mientras suena
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        // Cargar duración total al iniciar
        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audio.duration);
        });

        // Permitir saltar en la barra de progreso manualmente
        progressBar.addEventListener('input', () => {
            if (!isNaN(audio.duration)) {
                const seekTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        // Control de volumen
        volumeBar.addEventListener('input', () => {
            audio.volume = volumeBar.value;
        });
    </script>
</body>
</html>
