<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Música - Videojuegos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        .track { margin-bottom: 20px; }
        h2 { font-size: 1.2rem; margin-bottom: 8px; }
        audio { width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Mis Pistas</h1>
        
        <div class="track">
            <h2>Música 1</h2>
            <audio controls src="./musica1.mp3"></audio>
        </div>
        
        <div class="track">
            <h2>Música 2</h2>
            <audio controls src="./musica2.mp3"></audio>
        </div>
        
        <div class="track">
            <h2>Música 3</h2>
            <audio controls src="./musica3.mp3"></audio>
        </div>
        
        <div class="track">
            <h2>Música 4</h2>
            <audio controls src="./musica4.mp3"></audio>
        </div>
    </div>
</body>
</html>
