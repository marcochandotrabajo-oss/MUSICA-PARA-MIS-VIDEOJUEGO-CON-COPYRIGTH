<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Wave Music - Mark OC Music</title>
    <!-- Fuentes ochenteras de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --bg-dark: #090514;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            /* Fondo de cuadrícula en perspectiva estilo Synthwave */
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 127, 0.08) 1px, transparent 1px);
            background-size: 35px 35px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'VT323', monospace;
            overflow: hidden;
            position: relative;
        }

        /* Efecto de líneas de escaneo (Scanlines) de televisor antiguo */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
        }

        /* Sol ochentero Retro Wave en el horizonte */
        .retro-sun {
            position: absolute;
            bottom: 10vh;
            width: 280px;
            height: 280px;
            background: linear-gradient(to bottom, #ffea00, #ff0055);
            border-radius: 50%;
            box-shadow: 0 0 50px #ff0055;
            z-index: 1;
            /* Rayas horizontales recortadas en el sol */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 50%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 50%);
            -webkit-mask-size: 100% 16px;
            mask-size: 100% 16px;
        }

        /* Tarjeta principal del reproductor */
        .player-card {
            background: rgba(13, 2, 33, 0.85);
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(255, 0, 127, 0.3);
            text-align: center;
            z-index: 10;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .player-header {

            color: var(--neon-cyan);
