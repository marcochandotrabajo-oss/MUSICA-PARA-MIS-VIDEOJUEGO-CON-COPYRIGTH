<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Audio - Mark OC Music</title>
    <!-- Fuentes futuristas y digitales -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff0055;
            --neon-cyan: #00ffff;
            --neon-yellow: #f3e600;
            --bg-deep: #030308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            /* Fondo con patrón de ciber-rejilla oscura */
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        /* Destello ambiental de neón de fondo */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,0,85,0.15) 0%, rgba(0,243,255,0.05) 60%, transparent 100%);
            z-index: 1;
            filter: blur(50px);
            animation: pulse-glow 4s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Tarjeta principal del reproductor de neón */
        .player-card {
            background: rgba(8, 8, 18, 0.92);
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4), 
                        inset 0 0 20px rgba(255, 0, 85, 0.2);
            text-align: center;
            z-index: 10;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .player-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-cyan);
            letter-spacing: 4px;
            margin-bottom: 24px;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            text-transform: uppercase;
        }

        /* Pantalla LCD de neón estilo cyberpunk */
        .screen {
            background: #010104;
            border: 2px solid var(--neon-pink);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.6), 
                        0 0 10px rgba(255, 0, 85, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de línea brillante pasando por la pantalla */
        .screen::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: scanline 3s infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .track-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .artist-name {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Barra de progreso de neón */
        .progress-container {
            width: 100%;
            background: #0d0d1a;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            width: 0%;
            box-shadow: 0 0 12px var(--neon-pink), 0 0 20px var(--neon-cyan);
            transition: width 0.1s linear;
        }

        /* Botones de control futuristas */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.25);
            transition: all 0.2s ease-in-out;
            flex: 1;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .btn:hover {
            background: var(--neon-cyan);
